# Prometheus scrape config for xstore (start_metrics_server(9464) exposes /metrics).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: xstore
    metrics_path: /metrics
    static_configs:
      - targets: ["xstore:9464"]
        labels:
          service: xstore
