# Grafana dashboard provisioning; mount observability/grafana/dashboards at /var/lib/grafana/dashboards.
apiVersion: 1
providers:
  - name: xstore
    orgId: 1
    folder: xstore
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
