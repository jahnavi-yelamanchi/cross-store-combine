[project]
name = "xstore"
version = "0.1.0"
description = "Cross-store reconciliation agent: CDC drift detection, probabilistic matching, approved idempotent fixes, replayable ledger."
readme = "README.md"
license = "MIT"
authors = [{ name = "Jahnavi Yelamanchi" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "boto3>=1.43",
    "dagster>=1.8",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.1",
    "fastapi>=0.115",
    "fastavro>=1.9",
    "great-expectations>=1.0",
    "httpx>=0.27",
    "instructor>=1.5",
    "langfuse>=2.0",
    "langgraph>=0.2",
    "matplotlib>=3.9",
    "mcp>=1.2",
    "mongomock>=4.3",
    "moto[dynamodb,s3]>=5.0",
    "openlineage-python>=1.20",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.20",
    "pyarrow>=17",
    "pydantic[email]>=2.8",
    "pymongo>=4.8",
    "pyyaml>=6.0",
    "splink>=4.0",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "inspect-ai>=0.3",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-boto3>=1.35",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["smoke: fast per-package smoke test", "e2e: end-to-end on local backends"]
