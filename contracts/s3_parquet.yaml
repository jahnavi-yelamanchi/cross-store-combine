# Data contract (data product owned by data-platform). Bootstrapped by scripts/gen_contracts.py.
dataContractSpecification: 1.1.0
id: urn:datacontract:xstore:s3_parquet
store: s3_parquet
info:
  title: s3_parquet data product
  version: 1.0.0
  owner: data-platform
  domain: analytics
  description: Iceberg tables in the AWS lake.
  contact:
    name: data-platform
    channel: '#data-platform'
policy:
  schemaDrift: fail
  missingField: fail
  enum: fail
  typeDrift: warn
  typeDriftThreshold: 0.01
models:
  customer:
    description: Customer records as s3_parquet stores them natively.
    table: lake/customer
    primaryKey: customer_id
    freshness:
      field: updated_at
      maxAgeHours: 24
    fields:
      customer_id:
        type: string
        canonical: Customer.customer_id
        required: true
        primaryKey: true
      name:
        type: string
        canonical: Customer.name
        required: true
      email:
        type: string
        canonical: Customer.email
        format: email
        pii: true
      phone:
        type: string
        canonical: Customer.phone
        pii: true
      country:
        type: string
        canonical: Customer.country
      updated_at:
        type: timestamp
        canonical: Customer.updated_at
        required: true
    quality:
    - type: unique
      field: customer_id
    - type: length
      field: country
      min: 2
      max: 2
  order:
    description: Order records as s3_parquet stores them natively.
    table: lake/order
    primaryKey: order_id
    freshness:
      field: updated_at
      maxAgeHours: 24
    fields:
      order_id:
        type: string
        canonical: Order.order_id
        required: true
        primaryKey: true
      customer_id:
        type: string
        canonical: Order.customer_id
        required: true
      amount:
        type: decimal
        canonical: Order.amount
        required: true
        unit: currency_major
      currency:
        type: string
        canonical: Order.currency
        required: true
      status:
        type: string
        canonical: Order.status
        required: true
        enum:
        - pending
        - paid
        - shipped
        - cancelled
        - refunded
      ordered_at:
        type: timestamp
        canonical: Order.ordered_at
        required: true
      updated_at:
        type: timestamp
        canonical: Order.updated_at
        required: true
    quality:
    - type: unique
      field: order_id
    - type: range
      field: amount
      min: 0
    - type: length
      field: currency
      min: 3
      max: 3
