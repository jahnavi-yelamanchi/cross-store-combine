# kind cluster for chart tests: 1 control plane + 2 workers, ingress on host 80/443,
# image pulls for localhost:5001 go to a local registry container named kind-registry.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: xstore
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 80, protocol: TCP}
      - {containerPort: 443, hostPort: 443, protocol: TCP}
    extraMounts:
      - {hostPath: ./deploy/kind/certs.d, containerPath: /etc/containerd/certs.d}
  - role: worker
    extraMounts:
      - {hostPath: ./deploy/kind/certs.d, containerPath: /etc/containerd/certs.d}
  - role: worker
    extraMounts:
      - {hostPath: ./deploy/kind/certs.d, containerPath: /etc/containerd/certs.d}
