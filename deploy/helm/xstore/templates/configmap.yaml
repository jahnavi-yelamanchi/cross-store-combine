{{- if .Values.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "xstore.fullname" . }}-config
  labels:
    {{- include "xstore.labels" . | nindent 4 }}
data:
  policy.yaml: |-
    {{- .Files.Get "files/policy.yaml" | nindent 4 }}
  {{- range $path, $_ := .Files.Glob "files/mappings/*.yaml" }}
  mapping-{{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
