apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xstore.fullname" . }}-api
  labels:
    {{- include "xstore.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "xstore.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "xstore.podLabels" (dict "ctx" $ "component" "api") | nindent 8 }}
    spec:
      {{- include "xstore.podSpecCommon" . | nindent 6 }}
      containers:
        - name: api
          image: {{ include "xstore.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.api.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            {{- include "xstore.env" (dict "ctx" $ "env" .Values.api.env) | trim | nindent 12 }}
          {{- with (include "xstore.envFrom" .) }}
          envFrom:
            {{- . | trim | nindent 12 }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "xstore.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "xstore.volumes" . | nindent 8 }}
