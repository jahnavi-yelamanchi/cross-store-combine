{{- /*
No Secret is rendered: workloads read secrets.existingSecret / extraExistingSecrets via envFrom.
Fail early in non-local modes when nothing is referenced.
*/ -}}
{{- if and (ne (toString .Values.env.STORE_BACKEND) "local") (not .Values.secrets.existingSecret) }}
{{- fail "secrets.existingSecret is required when env.STORE_BACKEND is not 'local'" }}
{{- end }}
